[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ballet-com-cop-analyzer"
version = "0.1.0"
description = "Kinematics-only COM-COP inclination angle (IA/RCIA) from pose, applied to ballet balance."
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Yu-Hsin Chang", email = "hsinn.earth7@gmail.com"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
video = ["mediapipe>=0.10", "opencv-python>=4.8"]
forceplate = ["ezc3d>=1.5"]
dev = ["pytest>=7.0", "pytest-cov", "hypothesis>=6.0", "ruff", "black", "mypy", "bandit"]

[tool.setuptools]
packages = ["balletcomcop"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.12"  # analysis target: modern numpy stubs use PEP 695 `type` (3.12+); runtime still supports 3.10+ (see requires-python + CI matrix)
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
